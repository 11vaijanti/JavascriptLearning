
<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="swggame.css">
</head>
<body>

    <h1>Snake Water Gun</h1>

    <h2>Choose Your Move</h2>

    <button onclick="playGame('snake')">🐍 Snake</button>
    <button onclick="playGame('water')">💧 Water</button>
    <button onclick="playGame('gun')">🔫 Gun</button>

    <h2 id="result">Make your choice!</h2>

    <p id="computerChoice">Computer Choice: -</p>

    <p id="score">Your Score: 0 | Computer Score: 0</p>

    <button onclick="resetGame()">Reset Game</button>

    <script src="swggame.js"></script>
</body>
</html>
